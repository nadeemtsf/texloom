name: Check and build Windows
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check Rust source model
        run: cargo test --locked -p texloom-core
      - name: Check optional recovery checkpoint codec
        run: cargo test --locked -p texloom-core --features recovery-serde
      - name: Check frontend transactions and PDF geometry
        run: npm test
      - name: Check build scheduling, snapshots and process-tree cleanup
        run: cargo test --locked -p texloom-build
      - name: Check native document protocol
        run: cargo test --locked -p texloom-desktop --features typegen --lib
      - name: Prepare pinned development PDFium and independent reference
        shell: pwsh
        run: |
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --platform win_amd64 --dest .tools/pdfium-wheels pypdfium2==5.14.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/proof/prepare_pdfium.py .tools/pdfium-wheels/pypdfium2-5.14.0-py3-none-win_amd64.whl .tools/native-pdfium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --target .tools/proof-python -r scripts/proof/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path (Get-Location) '.tools/proof-python'
          python scripts/proof/inspect_pdf.py tests/fixtures/objects/baseline.pdf .tools/pdfium-reference/baseline.json
      - name: Check isolated native PDF inspection against reference
        shell: pwsh
        run: |
          $env:TEXLOOM_PDFIUM_TEST_DLL = Join-Path (Get-Location) '.tools/native-pdfium/pdfium.dll'
          $env:TEXLOOM_PDFIUM_REFERENCE = Join-Path (Get-Location) '.tools/pdfium-reference/baseline.json'
          cargo test --locked -p texloom-build --test pdfium_worker -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p texloom-build --bin pdfium_worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native document approval with the actual isolated renderer
        shell: pwsh
        run: |
          node scripts/prepare-native-verifier.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEXLOOM_PDFIUM_TEST_DLL = Join-Path (Get-Location) 'src-tauri/resources/verification/pdfium.dll'
          $env:TEXLOOM_PDFIUM_TEST_WORKER = Join-Path (Get-Location) 'src-tauri/resources/verification/pdfium_worker.exe'
          cargo test --locked -p texloom-desktop --lib -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned desktop executable
        run: npm run desktop:build -- --no-bundle --target x86_64-pc-windows-msvc
      - name: Package portable build with notices
        shell: pwsh
        id: portable
        run: |
          $package = & ./scripts/package-portable.ps1
          "archive=$($package.ArchivePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Texloom-Windows-x64-development
          path: ${{ steps.portable.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
      - name: Measure native source editing and snapshot encoding
        shell: pwsh
        run: |
          cargo run --locked --release -p texloom-desktop --features benchmark --example source_benchmark --target x86_64-pc-windows-msvc -- artifacts/source-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Texloom-Native-Service-Benchmark
          path: artifacts/source-benchmark/report.json
          if-no-files-found: error
          retention-days: 30
