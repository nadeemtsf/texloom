name: Check and build Windows
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check Rust source model
        run: cargo test --locked -p texloom-core
      - name: Check frontend transactions and PDF geometry
        run: npm test
      - name: Check build scheduling, snapshots and process-tree cleanup
        run: cargo test --locked -p texloom-build
      - name: Check native document protocol
        run: cargo test --locked -p texloom-desktop --lib
      - name: Build unsigned desktop executable
        run: npm run desktop:build -- --no-bundle --target x86_64-pc-windows-msvc
      - name: Package portable build with notices
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Texloom-Windows-x64-development
          path: artifacts/Texloom-Desktop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
