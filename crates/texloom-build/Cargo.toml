[package]
name = "texloom-build"
version = "0.3.0"
edition = "2021"
license = "MIT"

[features]
typegen = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
quick-xml = "=0.42.0"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "=1.1.10"
encoding_rs = "=0.8.44"
texloom-core = { path = "../texloom-core", features = ["recovery-serde"] }
ts-rs = { version = "=11.1.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
