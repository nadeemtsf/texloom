[package]
name = "texloom-desktop"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
name = "texloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
benchmark = []
typegen = ["dep:ts-rs", "texloom-build/typegen"]

[[example]]
name = "source_benchmark"
required-features = ["benchmark"]

[[example]]
name = "native_reference_development"
required-features = ["benchmark"]

[[example]]
name = "native_selection_development"
required-features = ["benchmark"]

[[example]]
name = "document_bindings"
required-features = ["typegen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
texloom-core = { path = "../crates/texloom-core" }
texloom-build = { path = "../crates/texloom-build" }
ts-rs = { version = "=11.1.0", optional = true }
